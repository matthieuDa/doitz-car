  <title>DOITZ — Courtier Auto | Import Véhicules Europe</title>

<body class="antialiased font-sans selection:bg-brand-accent selection:text-white">
  <!-- Hidden Netlify form to enable automatic detection -->
  <form name="doitz-lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="doitz-lead" />
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="budget" />
    <input type="text" name="carType" />
    <input type="text" name="intent" />
    <input type="text" name="bot-field" />
  </form>
  <noscript>
    <h1>Doitz — Votre Courtier Auto en Véhicules Européens</h1>
    <p>Courtier automobile spécialisé dans le sourcing de véhicules neufs et d'occasion en Europe. Nous trouvons la meilleure affaire adaptée à votre cahier des charges.</p>
  </noscript>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
